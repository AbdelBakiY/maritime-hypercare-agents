# Snowflake CLI project definition — deploy with:
#   cd app && snow streamlit deploy --replace
# Database / schema / warehouse can be overridden with the CLI connection settings.
definition_version: 2
entities:
  hypercare_app:
    type: streamlit
    identifier:
      name: MARITIME_HYPERCARE_APP
      database: HYPERCARE_DB
      schema: PUBLIC
    main_file: streamlit_app.py
    title: "Maritime Hypercare Agents"
    query_warehouse: "COMPUTE_WH"
    compute_pool: "SYSTEM_COMPUTE_POOL_CPU"
    artifacts:
      - pyproject.toml
      - streamlit_app.py
      - hypercare_agents.py
      - .streamlit/config.toml
